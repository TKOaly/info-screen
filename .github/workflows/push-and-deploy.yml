name: Push

on:
    push:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Get commit SHA for Docker image tag
              id: sha
              run: echo "value=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

            - name: Log into registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ secrets.PRIVATE_REGISTRY_URL }}
                  username: ${{ secrets.PRIVATE_REGISTRY_USER }}
                  password: ${{ secrets.PRIVATE_REGISTRY_PW }}

            - name: Extract Docker metadata for the image
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ secrets.PRIVATE_REGISTRY_URL }}/infoscreen
                  tags: |
                      type=schedule
                      type=ref,event=branch
                      type=ref,event=tag
                      type=ref,event=pr
                      type=raw,value=sha-${{ steps.sha.outputs.value }}

            - name: Build and push the Docker image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  build-args: |
                      COMMIT_SHA=${{ steps.sha.outputs.value }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-to: type=gha
                  cache-from: type=gha

            - name: Trigger deployment
              env:
                  DEPLOYMENT_PAT: ${{ secrets.DEPLOYMENT_PAT }}
                  DEPLOYMENT_TAG: sha-${{ steps.sha.outputs.value }}
              run: |
                  if [ -z "$DEPLOYMENT_PAT" ]; then
                      echo "::warning::Skipping deployment trigger because DEPLOYMENT_PAT is not configured."
                      exit 0
                  fi

                  response_file="$(mktemp)"
                  status_code="$(
                      curl --silent --show-error --output "$response_file" --write-out "%{http_code}" \
                          --request POST \
                          --header "Accept: application/vnd.github+json" \
                          --header "Authorization: Bearer $DEPLOYMENT_PAT" \
                          --header "X-GitHub-Api-Version: 2022-11-28" \
                          https://api.github.com/repos/TKOaly/tko-aly-k8s-configs/actions/workflows/Bump%20Service/dispatches \
                          --data "{\"ref\":\"main\",\"inputs\":{\"service\":\"infoscreen\",\"tag\":\"$DEPLOYMENT_TAG\"}}"
                  )"

                  if [ "$status_code" != "204" ]; then
                      echo "::warning::Image build succeeded, but deployment dispatch failed with HTTP $status_code. Check DEPLOYMENT_PAT permissions/expiry."
                      cat "$response_file"
                      exit 0
                  fi

                  echo "Deployment workflow dispatched for $DEPLOYMENT_TAG."
